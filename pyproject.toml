[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["F401", "E401", "E402", "E501", "E702"]

[tool.mypy]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["app/tests", "venv", ".venv"]
skips = ["B101"]  # allow assert in tests

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 50
