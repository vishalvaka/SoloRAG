name: CI

on:
  push:
    branches: [ main, dev, feature/** ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
# ───────────────────────────── 1) Lint + Security Scan (Code) ──────────────
  lint-and-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-dev-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-dev-

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint + format check)
        run: ruff check . --output-format=github
        continue-on-error: true

      - name: Bandit (Python SAST)
        run: bandit -r app/ -c pyproject.toml --format json --output bandit-report.json || true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

# ───────────────────────────── 2) Tests + Coverage ─────────────────────────
  test:
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///
      LLM_BACKEND: ollama
      OLLAMA_URL: http://fake-ollama:11434
      OLLAMA_MODEL: test-model
      VECTOR_BACKEND: faiss
      FAISS_FORCE_CPU: "1"
      SESSION_BACKEND: memory
      CACHE_BACKEND: none

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements/common.txt
          pip install -r requirements/cpu.txt
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install aiosqlite

      - name: Run tests with coverage
        run: |
          pytest app/tests/ \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --junitxml=junit.xml \
            -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: junit.xml

# ───────────────────────────── 3) Dependency vulnerability scan ────────────
  dep-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements/common.txt
          pip install pip-audit safety

      - name: pip-audit (known vulnerabilities)
        run: pip-audit --format json --output pip-audit-report.json || true

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json

# ───────────────────────────── 4) Container security scan (Trivy) ─────────
  container-scan:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build Fargate image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/fargate.Dockerfile
          push: false
          load: true
          tags: solorag-fargate:scan

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: solorag-fargate:scan
          format: table
          exit-code: "0"   # warn but don't block (change to "1" to enforce)
          severity: CRITICAL,HIGH

      - name: Trivy SARIF output
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: solorag-fargate:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif

# ───────────────────────────── 5) Build & push to GHCR ────────────────────
  docker-ghcr:
    needs: [test, lint-and-sast]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: vars
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/backend"
          echo "image=$(echo $IMAGE | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build & push backend image (CPU)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.Dockerfile
          build-args: |
            BUILD_MODE=cpu
            BASE_IMAGE=python:3.11-slim
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:${{ github.sha }}

# ───────────────────────────── 6) Build & push to ECR ─────────────────────
  docker-ecr:
    needs: [test, container-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # OIDC
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # OIDC-based AWS authentication (no long-lived keys)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR image URI
        id: ecr-vars
        run: |
          echo "image=${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPO }}" >> "$GITHUB_OUTPUT"

      - name: Build & push Fargate image to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/fargate.Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-vars.outputs.image }}:latest
            ${{ steps.ecr-vars.outputs.image }}:${{ github.sha }}
